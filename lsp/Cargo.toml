[package]
name = "nova-lsp"
version = "0.3.0"
edition = "2021"
description = "NOVA Language Server Protocol implementation"
authors = ["NOVA Team"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lsp-types = "0.94"
tower-lsp = "0.20"
tokio = { version = "1.35", features = ["full"] }
thiserror = "1.0"
nova-common = { path = "../crates/nova-common" }
nova-compiler = { path = "../compiler" }

[[bin]]
name = "nova-lsp"
path = "src/main.rs"
