name: Coverage

# G6 in DEV_PLAN.md. A ratchet: the floor in `coverage-floor.txt` may only go up.
#
# Line coverage is computed from LCOV records rather than from the summary table,
# because the table's column order is a presentation detail and a gate should not
# depend on one. `LF` is lines found, `LH` is lines hit; the ratio is the number.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: Line coverage may not fall
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4

      # `llvm-tools-preview` is what cargo-llvm-cov instruments with.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec   # was @stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      - name: Measure
        run: |
          set -eu
          # One run of the test suite, instrumented. `--no-fail-fast` so a single
          # failing test still produces a coverage number to compare.
          cargo llvm-cov --workspace --lcov --output-path lcov.info --no-fail-fast

      - name: Compare to the floor
        run: |
          python3 - <<'PY'
          import pathlib, sys

          lines_found = lines_hit = 0
          for line in pathlib.Path("lcov.info").read_text().splitlines():
              if line.startswith("LF:"):
                  lines_found += int(line[3:])
              elif line.startswith("LH:"):
                  lines_hit += int(line[3:])

          if lines_found == 0:
              sys.exit("lcov.info has no LF records — the instrumented run produced nothing")

          coverage = 100.0 * lines_hit / lines_found
          print(f"lines: {lines_hit} of {lines_found} = {coverage:.2f}%")

          floor_file = pathlib.Path("coverage-floor.txt")
          if not floor_file.exists():
              print("no coverage-floor.txt yet — reporting only.")
              print(f"To make this a ratchet, commit the line `{coverage:.2f}`.")
              sys.exit(0)

          text = floor_file.read_text().strip()
          try:
              floor = float(text.split()[0])
          except (ValueError, IndexError):
              sys.exit(f"coverage-floor.txt must start with a number, found {text!r}")

          print(f"floor: {floor:.2f}%")
          if coverage + 0.05 < floor:
              print(f"::error::line coverage fell to {coverage:.2f}%, below the floor of {floor:.2f}%")
              print("Either cover the new code, or lower the floor in the same commit")
              print("and say in the message why the drop is acceptable.")
              sys.exit(1)

          print("coverage is at or above the floor")
          if coverage > floor + 1.0:
              print(f"Coverage rose to {coverage:.2f}%. Raise the floor to {coverage:.2f} to lock it in.")
          PY
