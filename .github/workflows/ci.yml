
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read      # explicit least privilege. With no `permissions:` a workflow
                      # inherits the REPOSITORY default, which is an unrecorded setting
                      # (82 of 83 repos are `read`, CLDR is `write`). Declaring it here
                      # means a change to that default cannot silently grant this
                      # workflow more than it needs. This workflow only reads.

jobs:
  lint:
    name: Format and lints (advisory)
    runs-on: ubuntu-latest
    # Advisory on purpose. `cargo fmt --check` on a workspace that has never been
    # formatted fails on every file at once, so making this blocking today would
    # turn a working build red without telling anyone anything new.
    #
    # `continue-on-error` sits on the steps, not the job, so the job still
    # concludes success and does not mark every pull request "unstable". The
    # failure is in the step log and in the annotation. Move it to the job — or
    # drop it — in the same pull request that lands `cargo fmt --all`.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec   # was @stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
        continue-on-error: true
      - run: cargo clippy --workspace --all-targets -- -D warnings
        continue-on-error: true

  rust-workspace:
    name: Build Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec   # was @stable
      - name: The grammar still describes the compiler
        run: python3 tools/grammar-check.py
      - name: Every shipped example is a NOVA program
        run: python3 tools/example-check.py
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      - name: Every example builds and runs
        run: |
          cargo build -p nova-compiler
          # `examples/**/*.nova`, not `examples/*.nova`: basic/hello.nova and
          # web/app.nova are examples too, and the flat glob skipped them.
          while IFS= read -r example; do
            echo "running $example"
            ./target/debug/nova-compiler run "$example" > /dev/null
          done < <(find examples -name '*.nova' | sort)
      - name: Every standard-library module emits C
        run: |
          for module in stdlib/*/*.nova; do
            ./target/debug/nova-compiler emit "$module" -o "/tmp/$(basename "$module" .nova).c"
          done
      - name: Generated JavaScript runs
        run: |
          ./target/debug/nova-compiler emit examples/hello.nova --target js > /tmp/hello.js
          test "$(node /tmp/hello.js)" = "Hello, NOVA"
      - name: Generated Rust runs
        run: |
          ./target/debug/nova-compiler emit examples/hello.nova --target rust > /tmp/hello.rs
          rustc /tmp/hello.rs -o /tmp/hello-rust
          test "$(/tmp/hello-rust)" = "Hello, NOVA"
      - name: Every example and parity program agrees across backends
        run: |
          npm install --global wat2wasm
          for program in examples/*.nova tests/parity/*.nova; do
            ./target/debug/nova-compiler test --parity "$program"
          done
      # The benchmark moved to `bench.yml`. A 1.5x wall-clock ratio gate on a
      # shared runner measures the runner, not the compiler, and it failed for
      # reasons nobody could act on. It now runs on a schedule and on demand,
      # where a noisy result can be re-run instead of blocking a merge.
