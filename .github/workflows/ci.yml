
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read      # explicit least privilege. With no `permissions:` a workflow
                      # inherits the REPOSITORY default, which is an unrecorded setting
                      # (82 of 83 repos are `read`, CLDR is `write`). Declaring it here
                      # means a change to that default cannot silently grant this
                      # workflow more than it needs. This workflow only reads.

jobs:
  rust-workspace:
    name: Build Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec   # was @stable
      - name: The grammar still describes the compiler
        run: python3 tools/grammar-check.py
      - name: Every shipped example is a NOVA program
        run: python3 tools/example-check.py
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      - name: Every example builds and runs
        run: |
          cargo build -p nova-compiler
          for example in examples/*.nova; do
            ./target/debug/nova-compiler run "$example" > /dev/null
          done
      - name: Every standard-library module emits C
        run: |
          for module in stdlib/*/*.nova; do
            ./target/debug/nova-compiler emit "$module" -o "/tmp/$(basename "$module" .nova).c"
          done
      - name: Generated JavaScript runs
        run: |
          ./target/debug/nova-compiler emit examples/hello.nova --target js > /tmp/hello.js
          test "$(node /tmp/hello.js)" = "Hello, NOVA"
      - name: Generated Rust runs
        run: |
          ./target/debug/nova-compiler emit examples/hello.nova --target rust > /tmp/hello.rs
          rustc /tmp/hello.rs -o /tmp/hello-rust
          test "$(/tmp/hello-rust)" = "Hello, NOVA"
      - name: Generated WebAssembly runs
        run: |
          npm install --global wat2wasm
          ./target/debug/nova-compiler test --parity examples/hello.nova
      - name: Benchmark does not regress
        run: BENCH_MAX_RATIO=1.5 ./benches/run.sh 5
