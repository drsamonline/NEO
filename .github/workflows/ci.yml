
name: CI

# The main gate: does it build, do the tests pass, and does every program in the
# repository still compile and run? Everything here is blocking.
#
# `docs/tooling.md` says what each workflow guards and why some are advisory.

on:
  push:
  pull_request:

permissions:
  contents: read      # explicit least privilege. With no `permissions:` a workflow
                      # inherits the REPOSITORY default, which is an unrecorded setting
                      # (82 of 83 repos are `read`, CLDR is `write`). Declaring it here
                      # means a change to that default cannot silently grant this
                      # workflow more than it needs. This workflow only reads.

jobs:
  lint:
    name: Format and lints (advisory)
    runs-on: ubuntu-latest
    # Advisory on purpose. `cargo fmt --check` on a workspace that has never been
    # formatted fails on every file at once, so making this blocking today would
    # turn a working build red without telling anyone anything new.
    #
    # `continue-on-error` sits on the steps, not the job, so the job still
    # concludes success and does not mark every pull request "unstable". The
    # failure is in the step log and in the annotation. Move it to the job — or
    # drop it — in the same pull request that lands `cargo fmt --all`.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec   # was @stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
        continue-on-error: true
      - run: cargo clippy --workspace --all-targets -- -D warnings
        continue-on-error: true

  rust-workspace:
    name: Build Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec   # was @stable
      # No toolchain needed, so it runs first: a documentation regression is the
      # cheapest failure to report and the most annoying one to discover later.
      - name: Every document is written, reachable and explained
        run: python3 tools/docs-check.py

      # The manifest records provenance for two files. `tools/manifest.py check` cannot
      # gate on its exit code — a correct file and a drifted one both answer `protected` —
      # so this reads the statuses and fails only on drift it can actually see.
      - name: MANIFEST.json still describes the files it records
        run: python3 tools/manifest-check.py

      # A `[workspace.dependencies]` entry nothing opts into is a claim about the project
      # that is not true. `cargo` warns; a warning is not a gate.
      - name: Every workspace dependency is used by a member
        run: python3 tools/workspace-dep-check.py

      # Five documents quoted the test suite as 199, 316 and 193 while it was 342. Each number
      # was true on the day it was typed. This is the check that stops the sixth.
      - name: Every number a document states matches the thing it counts
        run: python3 tools/count-check.py

      - name: The stdlib README matches what the stdlib can actually run
        run: python3 tools/stdlib-check.py

      - name: The grammar still describes the compiler
        run: python3 tools/grammar-check.py
      - name: Every shipped example is a NOVA program
        run: python3 tools/example-check.py
      # Ten defects in one session came from two idioms: reading a type through
      # `TypeExpr::name`, and inspecting a `SirExpr` without unwrapping `Typed`. A
      # warning would be better; this repository has no lint infrastructure, and a
      # heuristic gate beats the no gate that let ten of them through.
      - name: A type keeps its arguments, and an expression keeps its shape
        run: python3 tools/type-name-check.py
      # Two modules were declared and empty — `semantic` beside a working analyser called
      # `sema`, and `ast` beside the real one in `nova-common`. An import of either compiles,
      # which is what makes an empty module worse than a missing one.
      - name: Every declared module has items
        run: python3 tools/module-check.py
      # Rule 4: numbers come from a command. ARCHITECTURE.md's line counts were typed by hand
      # and drifted — the Lowerer was 55% out — and one section pointed at a path that had
      # moved. Both are checked now.
      - name: ARCHITECTURE.md matches the repository
        run: python3 tools/architecture-check.py
      # `docs/status.json` is what other repositories read instead of copying our
      # numbers into their prose. Checking it here is what stops it drifting.
      - name: The published status matches the repository
        run: python3 tools/status.py --check
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      - name: Every example builds and runs
        run: |
          cargo build -p nova-compiler
          # `examples/**/*.nova`, not `examples/*.nova`: basic/hello.nova and
          # web/app.nova are examples too, and the flat glob skipped them.
          while IFS= read -r example; do
            echo "running $example"
            ./target/debug/nova-compiler run "$example" > /dev/null
          done < <(find examples -name '*.nova' | sort)
      - name: Every standard-library module emits C, and the C compiles
        run: |
          # Compiling is the point. Emitting alone let `math` ship a module whose C
          # could not be compiled at all — integer tuples where float ones were
          # declared, and `%` applied to two doubles — for as long as the step only
          # wrote the file out.
          #
          # Modules that do not compile yet are listed in `stdlib/not-compiling.txt`,
          # one per line with a reason. The check fails if a module outside that list
          # fails, and also if a module *inside* it starts compiling, so the list can
          # only shrink — the same ratchet as `coverage-floor.txt`.
          failed=""
          for module in stdlib/*/*.nova; do
            name="$(basename "$module" .nova)"
            if ! ./target/debug/nova-compiler emit "$module" -o "/tmp/$name.c" 2>"/tmp/$name.err"; then
              echo "::group::$name does not emit"; cat "/tmp/$name.err"; echo "::endgroup::"
              failed="$failed $name"
              continue
            fi
            # `-Werror=builtin-declaration-mismatch` makes the C compiler enumerate
            # the name collisions for us: a NOVA function called `floor` is a
            # definition of libm's `floor`, and this is the warning that says so.
            if cc -std=c11 -Werror=builtin-declaration-mismatch -c "/tmp/$name.c" -o "/tmp/$name.o" 2>"/tmp/$name.err"; then
              echo "compiled $name"
            else
              echo "::group::$name does not compile"; cat "/tmp/$name.err"; echo "::endgroup::"
              failed="$failed $name"
            fi
          done

          known="$(grep -vE '^\s*(#|$)' stdlib/not-compiling.txt | cut -d' ' -f1 | tr '\n' ' ')"
          status=0
          for name in $failed; do
            case " $known " in
              *" $name "*) echo "known: $name (see stdlib/not-compiling.txt)" ;;
              *) echo "::error::$name does not compile and is not in stdlib/not-compiling.txt"; status=1 ;;
            esac
          done
          for name in $known; do
            case " $failed " in
              *" $name "*) ;;
              *) echo "::error::$name is listed as not compiling but it does — remove it from stdlib/not-compiling.txt"; status=1 ;;
            esac
          done
          exit $status
      - name: Generated JavaScript runs
        run: |
          ./target/debug/nova-compiler emit examples/hello.nova --target js > /tmp/hello.js
          test "$(node /tmp/hello.js)" = "Hello, NOVA"
      - name: Generated Rust runs
        run: |
          ./target/debug/nova-compiler emit examples/hello.nova --target rust > /tmp/hello.rs
          rustc /tmp/hello.rs -o /tmp/hello-rust
          test "$(/tmp/hello-rust)" = "Hello, NOVA"
      - name: Every example and parity program agrees across backends
        run: |
          npm install --global wat2wasm
          for program in examples/*.nova tests/parity/*.nova; do
            ./target/debug/nova-compiler test --parity "$program"
          done
      # The benchmark moved to `bench.yml`. A 1.5x wall-clock ratio gate on a
      # shared runner measures the runner, not the compiler, and it failed for
      # reasons nobody could act on. It now runs on a schedule and on demand,
      # where a noisy result can be re-run instead of blocking a merge.
