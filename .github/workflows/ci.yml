
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read      # explicit least privilege. With no `permissions:` a workflow
                      # inherits the REPOSITORY default, which is an unrecorded setting
                      # (82 of 83 repos are `read`, CLDR is `write`). Declaring it here
                      # means a change to that default cannot silently grant this
                      # workflow more than it needs. This workflow only reads.

jobs:
  rust-workspace:
    name: Build Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
