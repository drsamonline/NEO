[workspace]
members = [
    "compiler",
    "runtime",
    "pkg",
    "lsp",
    "dbg",
    "crates/nova-common",
    "backends/javascript",
    "backends/rust",
    "backends/wasm",
    "integration_tests",
]
# `fuzz/` is its own workspace with its own lockfile: cargo-fuzz needs a nightly
# sanitizer profile that must not leak into the build everyone else uses.
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.6.1"
edition = "2021"

[workspace.lints.rust]
# In an `unsafe fn` the body is not implicitly unsafe in edition 2024, and being
# explicit about which operations rely on the caller's contract is the whole
# point of the `# Safety` sections in `runtime/src/ffi.rs`. Only `runtime` opts
# in today; the other crates have no `unsafe` to reason about.
unsafe_op_in_unsafe_fn = "deny"

[workspace.metadata.nova]
status = "integration-complete"

[workspace.dependencies]
nova-common = { path = "crates/nova-common" }
nova-compiler = { path = "compiler" }
nova-runtime = { path = "runtime" }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
