[workspace]
members = [
    "compiler",
    "runtime",
    "package-manager",
    "language-server",
    "debugger",
    "dbg",
    "crates/nova-common",
    "backends/c",
    "backends/javascript",
    "backends/rust",
    "backends/wasm",
]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2021"

[workspace.metadata.nova]
status = "integration-complete"

[workspace.dependencies]
nova-common = { path = "crates/nova-common" }
nova-compiler = { path = "compiler" }
nova-runtime = { path = "runtime" }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
