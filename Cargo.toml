[workspace]
members = [
    "compiler",
    "pkg",
    "lsp",
    "dbg",
    "crates/nova-common",
    "backends/javascript",
    "backends/rust",
    "backends/wasm",
    "integration_tests",
]
# `fuzz/` is its own workspace with its own lockfile: cargo-fuzz needs a nightly
# sanitizer profile that must not leak into the build everyone else uses.
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.8.3"
edition = "2021"
# The repository is MIT (`LICENSE`). Declaring it per package matters: a crate
# with no `license` field is legally ambiguous for anyone who vendors it, and a
# root `LICENSE` file does not automatically attach to each crate's metadata.
license = "MIT"
repository = "https://github.com/drsamonline/NEO"
# Nothing here is on crates.io, and the README says so. Declaring it per package
# matters beyond bookkeeping: cargo-deny treats an undeclared crate as publishable
# and then refuses a path-only dependency, because crates.io does not allow one.
publish = false


[workspace.lints.rust]
# In an `unsafe fn` the body is not implicitly unsafe in edition 2024, and being
# explicit about which operations rely on the caller's contract is the whole
# point of the `# Safety` sections in `runtime/src/ffi.rs`. Only `runtime` opts
# in today; the other crates have no `unsafe` to reason about.
unsafe_op_in_unsafe_fn = "deny"

[workspace.metadata.nova]
status = "integration-complete"

