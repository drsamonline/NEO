[package]
name = "nova-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

# `../compiler`, not `..`: the repository root is a virtual workspace with no
# package of its own.
[dependencies.nova-compiler]
path = "../compiler"

[[bin]]
name = "lex"
path = "fuzz_targets/lex.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frontend"
path = "fuzz_targets/frontend.rs"
test = false
doc = false
bench = false

# Detaches this crate from the parent workspace, which is the layout cargo-fuzz
# expects: the fuzzer needs its own lockfile and its own sanitizer profile.
[workspace]
