[package]
name = "nova-integration-tests"
version.workspace = true
edition.workspace = true
description = "Cross-crate tests: NOVA source through the front end and every backend"
publish = false

# `cargo test` builds this lib with the test harness, so the `#[test]` functions
# in `lib.rs` run as part of `cargo test --workspace` like any other crate.
[lib]
path = "lib.rs"

[dependencies]
nova-compiler = { path = "../compiler" }
nova-backend-js = { path = "../backends/javascript" }
nova-backend-rust = { path = "../backends/rust" }
nova-backend-wasm = { path = "../backends/wasm" }
